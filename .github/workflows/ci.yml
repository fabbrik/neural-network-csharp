name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both are covered deliberately: Vector<float> is 4 wide on ARM and 8 on x86,
        # so the SIMD paths and their scalar tails differ between them.
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Run the demo
        run: dotnet run --no-build --configuration Release --project src/NN.Demo

      # A smoke test of the whole MNIST path — download, IDX parsing, training, reporting —
      # cut down to one epoch on 5000 images so it costs seconds rather than a minute.
      # If the mirrors are unreachable the demo reports that and exits 0 by design, so a
      # dataset outage cannot turn into a red build.
      - name: Run the MNIST demo (smoke test)
        run: dotnet run --no-build --configuration Release --project src/NN.Mnist -- --epochs 1 --train 5000

      # Built, not run. Benchmark timings from shared cloud runners are noise, but an
      # unbuilt benchmark project silently rots against the library it measures.
      - name: Build the benchmarks
        run: dotnet build --no-restore --configuration Release bench/NN.Bench
